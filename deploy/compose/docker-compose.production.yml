name: opengmao

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opengmao}
      POSTGRES_USER: ${POSTGRES_USER:-opengmao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the external runtime environment}
    volumes:
      - opengmao_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    profiles: ["migrate"]
    build:
      context: ../..
      target: builder
    image: ${OPENGMAO_MIGRATION_IMAGE:-gmao-maintenance-quality:migrate-local}
    command: ["npm", "run", "prisma:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the external runtime environment}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    build:
      context: ../..
      target: runner
    image: ${OPENGMAO_IMAGE:-gmao-maintenance-quality:local}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the external runtime environment}
      NODE_ENV: production
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /app/data/documents
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TRUST_PROXY_HOPS: ${RATE_LIMIT_TRUST_PROXY_HOPS:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${OPENGMAO_BIND_ADDRESS:-127.0.0.1}:${OPENGMAO_PORT:-3000}:3000"
    volumes:
      - opengmao_documents:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  opengmao_postgres:
  opengmao_documents:
