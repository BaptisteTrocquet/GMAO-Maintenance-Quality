name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opengmao
          POSTGRES_PASSWORD: opengmao
          POSTGRES_DB: opengmao
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opengmao"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://opengmao:opengmao@localhost:5432/opengmao?schema=public
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply committed migrations
        run: npm run prisma:deploy

      - name: Verify migration status
        run: npm run prisma:status

      - name: Seed synthetic demo data
        run: npm run prisma:seed

      - name: Verify production backup procedure
        shell: bash
        env:
          STORAGE_PROVIDER: local
          STORAGE_LOCAL_DIR: ${{ runner.temp }}/gmao-backup-documents
          BACKUP_ROOT: ${{ runner.temp }}/gmao-backups
          BACKUP_TIMESTAMP: ci
          BACKUP_ACKNOWLEDGE_QUIESCED: "true"
        run: |
          set -euo pipefail
          mkdir -p "$STORAGE_LOCAL_DIR"
          printf 'synthetic controlled document\n' > "$STORAGE_LOCAL_DIR/ci-document.txt"

          npm run backup:production

          backup_dir="$BACKUP_ROOT/gmao-$BACKUP_TIMESTAMP"
          test -s "$backup_dir/postgres.dump"
          test -s "$backup_dir/documents.tar.gz"
          test -s "$backup_dir/manifest.txt"
          test -s "$backup_dir/SHA256SUMS"
          test "$(stat -c '%a' "$backup_dir")" = "700"
          (
            cd "$backup_dir"
            sha256sum -c SHA256SUMS
            pg_restore --list postgres.dump >/dev/null
            tar -tzf documents.tar.gz | grep -q 'ci-document.txt'
          )

      - name: Drill production restore into isolated targets
        shell: bash
        env:
          RESTORE_SOURCE_DIR: ${{ runner.temp }}/gmao-backups/gmao-ci
          RESTORE_DATABASE_URL: postgresql://opengmao:opengmao@localhost:5432/opengmao_restore?schema=public
          RESTORE_STORAGE_DIR: ${{ runner.temp }}/gmao-restored-documents
          RESTORE_ACKNOWLEDGE_ISOLATED_TARGET: "true"
        run: |
          set -euo pipefail

          source_pg_url="$(node -e '
            const url = new URL(process.env.DATABASE_URL);
            url.searchParams.delete("schema");
            process.stdout.write(url.toString());
          ')"
          admin_pg_url="$(node -e '
            const url = new URL(process.env.DATABASE_URL);
            url.search = "";
            url.pathname = "/postgres";
            process.stdout.write(url.toString());
          ')"
          restore_pg_url="$(node -e '
            const url = new URL(process.env.RESTORE_DATABASE_URL);
            url.searchParams.delete("schema");
            process.stdout.write(url.toString());
          ')"

          cleanup() {
            psql "$admin_pg_url" --set=ON_ERROR_STOP=1 --command='DROP DATABASE IF EXISTS opengmao_restore WITH (FORCE);' >/dev/null 2>&1 || true
            rm -rf "$RESTORE_STORAGE_DIR" "${RESTORE_STORAGE_DIR}.second"
          }
          trap cleanup EXIT
          cleanup

          source_org_count="$(psql "$source_pg_url" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='SELECT count(*) FROM "Organization";' | tr -d '[:space:]')"
          source_site_count="$(psql "$source_pg_url" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='SELECT count(*) FROM "Site";' | tr -d '[:space:]')"
          source_work_order_count="$(psql "$source_pg_url" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='SELECT count(*) FROM "WorkOrder";' | tr -d '[:space:]')"

          psql "$admin_pg_url" --set=ON_ERROR_STOP=1 --command='CREATE DATABASE opengmao_restore;'

          npm run restore:production

          restored_org_count="$(psql "$restore_pg_url" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='SELECT count(*) FROM "Organization";' | tr -d '[:space:]')"
          restored_site_count="$(psql "$restore_pg_url" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='SELECT count(*) FROM "Site";' | tr -d '[:space:]')"
          restored_work_order_count="$(psql "$restore_pg_url" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='SELECT count(*) FROM "WorkOrder";' | tr -d '[:space:]')"

          test "$restored_org_count" = "$source_org_count"
          test "$restored_site_count" = "$source_site_count"
          test "$restored_work_order_count" = "$source_work_order_count"
          test "$(cat "$RESTORE_STORAGE_DIR/ci-document.txt")" = "synthetic controlled document"

          DATABASE_URL="$RESTORE_DATABASE_URL" npm run prisma:status
          DATABASE_URL="$RESTORE_DATABASE_URL" npm run test:db

          if RESTORE_STORAGE_DIR="${RESTORE_STORAGE_DIR}.second" npm run restore:production; then
            echo "restore unexpectedly overwrote a non-empty target database" >&2
            exit 1
          fi

      - name: Database integration smoke check
        run: npm run test:db

      - name: Analytics realistic-volume benchmark
        run: npm run test:analytics:perf

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Browser E2E smoke test
        run: npm run test:e2e

      - name: Build TypeScript SDK
        run: npm run sdk:build

      - name: Run integration examples
        run: npm run examples:check

      - name: Build
        run: npm run build

      - name: Build production Docker image
        run: docker build --pull --tag gmao-maintenance-quality:ci .

      - name: Verify production Docker runtime contract
        run: >-
          docker run --rm --entrypoint sh gmao-maintenance-quality:ci -c
          'test "$(id -u)" = "1001" &&
          test -f /app/server.js &&
          test -w /app/data/documents &&
          test ! -e /app/.env &&
          test "$NODE_ENV" = "production"'

      - name: Verify production health probes
        shell: bash
        run: |
          set -euo pipefail
          container_name="gmao-health-ci"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --network host \
            --health-interval=1s \
            --health-timeout=3s \
            --health-start-period=1s \
            --health-retries=10 \
            --env DATABASE_URL="postgresql://opengmao:opengmao@127.0.0.1:5432/opengmao?schema=public" \
            gmao-maintenance-quality:ci

          for attempt in {1..30}; do
            if node -e "fetch('http://127.0.0.1:3000/api/health').then(async (response) => { const body = await response.json(); if (response.status !== 200 || body?.data?.status !== 'ok') process.exit(1); }).catch(() => process.exit(1));"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done

          node -e "fetch('http://127.0.0.1:3000/api/ready').then(async (response) => { const body = await response.json(); if (response.status !== 200 || body?.data?.status !== 'ready' || body?.data?.checks?.database !== 'reachable') process.exit(1); }).catch(() => process.exit(1));"

          for attempt in {1..15}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker inspect "$container_name"
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
