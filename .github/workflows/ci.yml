name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: opengmao
          POSTGRES_PASSWORD: opengmao
          POSTGRES_DB: opengmao
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opengmao"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://opengmao:opengmao@localhost:5432/opengmao?schema=public
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply versioned database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify migration history
        run: npm run prisma:migrate:status

      - name: Verify migrated database matches Prisma schema
        run: npm run prisma:migrate:drift

      - name: Seed synthetic demo data
        run: npm run prisma:seed

      - name: Database integration smoke check
        run: npm run test:db

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build TypeScript SDK
        run: npm run sdk:build

      - name: Run integration examples
        run: npm run examples:check

      - name: Build
        run: npm run build
