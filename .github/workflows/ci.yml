name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opengmao
          POSTGRES_PASSWORD: opengmao
          POSTGRES_DB: opengmao
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opengmao"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://opengmao:opengmao@localhost:5432/opengmao?schema=public
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply schema to disposable database
        run: npx prisma db push

      - name: Seed synthetic demo data
        run: npm run prisma:seed

      - name: Database integration smoke check
        run: npm run test:db

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Browser E2E smoke test
        run: npm run test:e2e

      - name: Build TypeScript SDK
        run: npm run sdk:build

      - name: Run integration examples
        run: npm run examples:check

      - name: Build
        run: npm run build
