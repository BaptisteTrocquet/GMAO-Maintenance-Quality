name: Connector credential store

on:
  push:
    branches: [main]
    paths:
      - prisma/**
      - lib/integrations/credential-vault.ts
      - lib/integrations/prisma-credential-store.ts
      - scripts/check-credential-store-db.ts
      - package.json
      - package-lock.json
      - .github/workflows/credential-store.yml
  pull_request:
    paths:
      - prisma/**
      - lib/integrations/credential-vault.ts
      - lib/integrations/prisma-credential-store.ts
      - scripts/check-credential-store-db.ts
      - package.json
      - package-lock.json
      - .github/workflows/credential-store.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opengmao
          POSTGRES_PASSWORD: opengmao
          POSTGRES_DB: opengmao
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opengmao"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://opengmao:opengmao@localhost:5432/opengmao?schema=public
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply committed migrations
        run: npm run prisma:deploy

      - name: Seed synthetic demo data
        run: npm run prisma:seed

      - name: Exercise encrypted durable credential store
        run: npm run test:credential-store:db
