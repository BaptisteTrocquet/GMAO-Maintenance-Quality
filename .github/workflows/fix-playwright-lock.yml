name: Refresh Playwright lockfile

on:
  push:
    branches:
      - agent/e0-playwright-lock-fix

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/fix-playwright-lock.yml
          git commit -m "E0: sync Playwright dependency lockfile"
          git push origin HEAD:agent/e0-playwright-lock-fix
