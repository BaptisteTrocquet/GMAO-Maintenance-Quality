name: Generate Prisma baseline

on:
  push:
    branches:
      - agent/e0-prisma-migration-baseline

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate baseline SQL
        run: |
          mkdir -p prisma/migrations/0_init
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script --output prisma/migrations/0_init/migration.sql

      - name: Commit generated baseline and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations/0_init/migration.sql
          git rm .github/workflows/generate-prisma-baseline.yml
          git commit -m "E0: add reproducible dependency lock and Prisma baseline"
          git push origin HEAD:agent/e0-prisma-migration-baseline
